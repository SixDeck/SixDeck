<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="VI Community Launcher Emblem">
  <defs>
    <linearGradient id="sunsetGrad" x1="15%" y1="10%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#ff9a3c" />
      <stop offset="48%" stop-color="#f43f8e" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="ribbonLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8e8f6" />
      <stop offset="100%" stop-color="#e9c8f5" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1134" />
      <stop offset="100%" stop-color="#0d081a" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Original rounded-hex community shield -->
  <path d="M128 14 L222 68 Q232 74 232 86 L232 170 Q232 182 222 188 L128 242 Q128 242 128 242 L34 188 Q24 182 24 170 L24 86 Q24 74 34 68 Z"
        fill="url(#badgeBg)" stroke="url(#sunsetGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Subtle inner sunset horizon ring -->
  <circle cx="128" cy="126" r="70" fill="url(#sunsetGrad)" opacity="0.16" />
  <path d="M62 152 Q128 134 194 152" fill="none" stroke="url(#sunsetGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M76 164 Q128 150 180 164" fill="none" stroke="url(#sunsetGrad)" stroke-width="2" stroke-linecap="round" opacity="0.45" />

  <!-- Original geometric 'V' chevron ribbon -->
  <path d="M58 76 L85 76 L112 152 L139 76 L164 76 L124 184 L100 184 Z"
        fill="url(#ribbonLight)" filter="url(#softGlow)" />
  <!-- Accent diagonal sunset slash on the V right wing -->
  <path d="M139 76 L164 76 L142 136 L121 126 Z"
        fill="url(#sunsetGrad)" opacity="0.92" />

  <!-- Original geometric 'I' pillar with angled sunset cap -->
  <polygon points="175,76 201,76 196,102 175,102" fill="url(#sunsetGrad)" />
  <polygon points="175,110 198,110 198,184 175,184" fill="url(#ribbonLight)" />
</svg>
