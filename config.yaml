    terms:
      - "ai decompile"
      - "AI decompiler"
      - "LLM4Decompile"
      - "LLM decompilation"
      - "neural decompilation"
      - "binary translation"
      - "reverse engineering LLM"
      - "Ghidra AI"
      - "IDA Pro AI"
      - "shaders"
      - "shader generation"
      - "neural rendering"
  dumps:
    weight: 24
    terms:
      - "dumper"
      - "dump"
      - "ps5 dumper"
      - "orbis dumper"
      - "prospero dumper"
      - "itemzflow"
