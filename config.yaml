    terms:
      - "pc port"
      - "emulator"
      - "shadPS4"
      - "Kyty"
      - "fpPS4"
      - "PS5"
      - "PS5 emulator"
      - "ps5 recomp"
      - "orbis recomp"
      - "Xbox Series"
      - "scarlett"
      - "d3d12_xs"
      - "xgameruntime"
      - "Neonbridge"
      - "Flamingo"
      - "VItoriaBr"
      - "VIctory"
      - "ScarlettPort"
      - "xcl"
      - "tuxbox"
      - "XCRDAPI"
      - "DirectX 12"
      - "orbis"
      - "prospero"
      - "GNM"
      - "GNMX"
      - "libSce"
      - "translation layer"
      - "HLE"
      - "shaders"
      - "dx12"
  decomp:
    weight: 25
    terms:
      - "recomp"
      - "static recompilation"
      - "recompiler"
      - "decomp"
      - "decompilation"
      - "llvm recomp"
      - "ps5 recomp"
      - "orbis recomp"
      - "elf2cpp"
      - "symbols.toml"
      - "recomp_config"
      - "UnleashedRecomp"
      - "XenonRecomp"
      - "N64Recomp"
      - "RAGE9"
      - "RAGE 9"
      - "RAGE engine"
      - "rpf"
