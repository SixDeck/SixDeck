# Configuration du GTA 6 PC Port & Recompilation Tracker (v3 — Recherche globale)

general:
  min_relevance_score: 40
  strict_gta6_mode: true
  db_path: "data/tracker.db"
  reports_dir: "reports"
  request_timeout: 20.0
  head_timeout: 6.0
  max_concurrency: 6
  lookback_days: 90
  cycle_delay_seconds: 60
  jitter_min_seconds: 1.0
  jitter_max_seconds: 3.5
  top_display_limit: 20

# Identifiants obligatoires du jeu (ciblage strict GTA 6 / Recompilation)
gta6_identifiers:
  - "GTA 6"
  - "GTA6"
  - "GTA VI"
  - "Grand Theft Auto VI"
  - "Grand Theft Auto 6"
  - "GTAVI"
  - "GTA6Recomp"
  - "GTAVIRecomp"
  - "RAGE9"
  - "RAGE 9"
  - "Leonida"
  - "game_scarlett_master.exe"
  - "game_scarlett_master"
  - "game_prospero"

# Termes de recompilation haute valeur (bonus massif)
gta6_high_value_terms:
  - "game_scarlett_master.exe"
  - "game_scarlett_master"
  - "game_prospero"
  - "GTA6Recomp"
  - "GTAVIRecomp"
  - "static recompilation"
  - "recompiler"
  - "llvm recomp"
  - "ps5 recomp"
  - "orbis recomp"
  - "elf2cpp"
  - "symbols.toml"
  - "recomp_config"
  - "UnleashedRecomp"
  - "XenonRecomp"
  - "N64Recomp"
  - "pc port"
  - "playable build"
  - "full game"
  - "eboot.bin"
  - "rpf9"
  - "rpf8"
  - "rage9"
  - "rage 9"
  - "binary translation"
  - "ai decompile"
  - "sprx"
  - "d3d12_xs"
  - "d3d12_xs.dll"
  - "xgameruntime"
  - "neonbridge"
  - "scarlettport"
  - "xbox series"
  - "xcrdapi"

# Extensions de fichiers cibles à extraire & vérifier par HTTP HEAD
target_extensions:
  - ".tar.gz"
  - ".toml"
  - ".cpp"
  - ".h"
  - ".cmake"
  - ".elf"
  - ".sprx"
  - ".rpf"
  - ".zip"
  - ".7z"
  - ".bin"

# Mots-clés techniques pondérés par pilier technologique
keywords:
  emulation:
